server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: parcel-service
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:huertos}
    username: ${POSTGRES_USER:huertos}
    password: ${POSTGRES_PASSWORD:huertos}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
    show-sql: false

logging:
  level:
    com.huertosurbanos.parcelas: INFO
    org.hibernate.SQL: WARN
