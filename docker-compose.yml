services:
  postgres:
    image: postgres:16-alpine
    container_name: huertos-postgres
    environment:
      POSTGRES_DB: huertos
      POSTGRES_USER: huertos
      POSTGRES_PASSWORD: huertos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U huertos -d huertos"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  parcel-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: huertos-parcel-service
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: huertos
      POSTGRES_USER: huertos
      POSTGRES_PASSWORD: huertos
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
